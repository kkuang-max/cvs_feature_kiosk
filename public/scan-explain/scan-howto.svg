      <stop offset="0" stop-color="#CC0000" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#CC0000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6FA8DC"/>
      <stop offset="0.55" stop-color="#1F3F7A"/>
      <stop offset="1" stop-color="#0B1630"/>
    </radialGradient>
  </defs>
  <!-- underside of the kiosk with its camera -->
  <rect x="30" y="0" width="200" height="30" rx="10" fill="#1A1A19"/>
  <rect x="30" y="0" width="200" height="12" fill="#1A1A19"/>
  <rect x="98" y="22" width="64" height="18" rx="9" fill="#2E2E2D"/>
